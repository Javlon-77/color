<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistik Ludo O'yini</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .menu {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #ffcc00;
            color: #333;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:hover {
            background: #ffdb4d;
            transform: translateY(-2px);
        }

        .game-container {
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .board {
            width: 450px;
            height: 450px;
            background: #fff;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            border: 4px solid #333;
            border-radius: 4px;
        }

        .cell {
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Asosiy uylar */
        .home-red { background: #ff4d4d; grid-column: 1 / 7; grid-row: 1 / 7; border: 3px solid #b30000; }
        .home-green { background: #2ecc71; grid-column: 10 / 16; grid-row: 1 / 7; border: 3px solid #27ae60; }
        .home-yellow { background: #f1c40f; grid-column: 1 / 7; grid-row: 10 / 16; border: 3px solid #f39c12; }
        .home-blue { background: #3498db; grid-column: 10 / 16; grid-row: 10 / 16; border: 3px solid #2980b9; }

        .path {
            background: #f9f9f9;
        }

        .safe {
            background: #e0e0e0;
        }

        .star::after {
            content: '⭐';
            font-size: 10px;
        }

        .panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 10px;
            min-width: 200px;
        }

        .dice-box {
            width: 80px;
            height: 80px;
            background: #fff;
            color: #333;
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 4px 8px rgba(0,0,0,0.3);
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s;
        }

        .dice-box:active {
            transform: scale(0.95);
        }

        .status {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
        }

        /* Chiplar (Fikhkalar) */
        .token {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            border: 2px solid #fff;
            z-index: 10;
            transition: transform 0.2s;
        }

        .token:hover {
            transform: scale(1.15);
        }

        .t-red { background: #ff1a1a; }
        .t-green { background: #00b33c; }
        .t-yellow { background: #ffcc00; color: #000; }
        .t-blue { background: #0066ff; }
    </style>
</head>
<body>

    <h1>LUDO MASTER</h1>
    
    <div class="menu">
        <button onclick="startGame('single')">Singleplayer (Bot)</button>
        <button onclick="startGame('multi')">Multiplayer (2 O'yinchi)</button>
    </div>

    <div class="game-container">
        <div class="board" id="board"></div>
        
        <div class="panel">
            <div class="status" id="status">O'yinni boshlang!</div>
            <div class="dice-box" id="dice" onclick="rollDice()">🎲</div>
            <div id="player-turn">Navbat: Qizil</div>
        </div>
    </div>

    <script>
        const board = document.getElementById('board');
        const statusText = document.getElementById('status');
        const diceBox = document.getElementById('dice');
        const turnText = document.getElementById('player-turn');

        let gameMode = 'single'; // 'single' yoki 'multi'
        let currentTurn = 0; // 0: Qizil, 1: Ko'k (Oddiy 2 o'yinchi rejimiga moslashtirildi)
        let diceVal = 0;
        let canMove = false;

        // Chiplarning boshlang'ich pozitsiyalari (-1 uyda degani)
        let tokens = {
            red: [-1, -1],
            blue: [-1, -1]
        };

        // Doskani chizish
        function createBoard() {
            board.innerHTML = '';
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    // Rangli uylarni belgilash
                    if (r < 6 && c < 6) cell.classList.add('home-red');
                    else if (r < 6 && c >= 9) cell.classList.add('home-green');
                    else if (r >= 9 && c < 6) cell.classList.add('home-yellow');
                    else if (r >= 9 && c >= 9) cell.classList.add('home-blue');
                    else {
                        cell.classList.add('path');
                    }

                    board.appendChild(cell);
                }
            }
            renderTokens();
        }

        function startGame(mode) {
            gameMode = mode;
            currentTurn = 0;
            tokens = { red: [-1, -1], blue: [-1, -1] };
            statusText.innerText = "Zarni tashlang!";
            updateTurnUI();
            createBoard();
        }

        function rollDice() {
            if (canMove) return;

            diceVal = Math.floor(Math.random() * 6) + 1;
            diceBox.innerText = ['⚀','⚁','⚂','⚃','⚄','⚅'][diceVal - 1];
            
            canMove = true;
            statusText.innerText = `Chiqdi: ${diceVal}. Chipni tanlang!`;

            // Agar Singleplayer bo'lsa va navbat Ko'k (bot) ga kelsa
            if (gameMode === 'single' && currentTurn === 1) {
                setTimeout(botMove, 1000);
            }
        }

        function updateTurnUI() {
            turnText.innerText = `Navbat: ${currentTurn === 0 ? "Qizil" : (gameMode === 'single' ? "Bot (Ko'k)" : "Ko'k")}`;
        }

        function renderTokens() {
            // Mavjud chiplarni tozalash
            document.querySelectorAll('.token').forEach(t => t.remove());

            // Qizil chiplarni joylash
            tokens.red.forEach((pos, index) => {
                const tokenEl = document.createElement('div');
                tokenEl.classList.add('token', 't-red');
                tokenEl.innerText = `R${index+1}`;
                tokenEl.onclick = () => moveToken('red', index);
                placeTokenOnBoard(tokenEl, pos, 'red', index);
            });

            // Ko'k chiplarni joylash
            tokens.blue.forEach((pos, index) => {
                const tokenEl = document.createElement('div');
                tokenEl.classList.add('token', 't-blue');
                tokenEl.innerText = `B${index+1}`;
                tokenEl.onclick = () => moveToken('blue', index);
                placeTokenOnBoard(tokenEl, pos, 'blue', index);
            });
        }

        function placeTokenOnBoard(element, pos, color, index) {
            let cell;
            if (pos === -1) {
                // Uy ichidagi koordinatalar
                let r = color === 'red' ? (index === 0 ? 1 : 4) : (index === 0 ? 10 : 13);
                let c = color === 'red' ? (index === 0 ? 1 : 4) : (index === 0 ? 10 : 13);
                cell = document.querySelector(`[data-row='${r}'][data-col='${c}']`);
            } else {
                // Oddiy yo'l koordinatalari (Soddalashtirilgan aylana yo'l)
                let pathCoords = getPathCoordinates();
                let coord = pathCoords[pos % pathCoords.length];
                cell = document.querySelector(`[data-row='${coord.r}'][data-col='${coord.c}']`);
            }
            if (cell) cell.appendChild(element);
        }

        // Oddiy harakat yo'lagi koordinatalari
        function getPathCoordinates() {
            return [
                {r: 6, c: 1}, {r: 6, c: 2}, {r: 6, c: 3}, {r: 6, c: 4}, {r: 6, c: 5},
                {r: 5, c: 6}, {r: 4, c: 6}, {r: 3, c: 6}, {r: 2, c: 6}, {r: 1, c: 6}, {r: 0, c: 6},
                {r: 0, c: 7}, {r: 0, c: 8}, {r: 1, c: 8}, {r: 2, c: 8}, {r: 3, c: 8}, {r: 4, c: 8}, {r: 5, c: 8},
                {r: 6, c: 9}, {r: 6, c: 10}, {r: 6, c: 11}, {r: 6, c: 12}, {r: 6, c: 13}, {r: 6, c: 14},
                {r: 7, c: 14}, {r: 8, c: 14}, {r: 8, c: 13}, {r: 8, c: 12}, {r: 8, c: 11}, {r: 8, c: 10}, {r: 8, c: 9},
                {r: 9, c: 8}, {r: 10, c: 8}, {r: 11, c: 8}, {r: 12, c: 8}, {r: 13, c: 8}, {r: 14, c: 8},
                {r: 14, c: 7}, {r: 14, c: 6}, {r: 13, c: 6}, {r: 12, c: 6}, {r: 11, c: 6}, {r: 10, c: 6}, {r: 9, c: 6},
                {r: 8, c: 5}, {r: 8, c: 4}, {r: 8, c: 3}, {r: 8, c: 2}, {r: 8, c: 1}, {r: 8, c: 0},
                {r: 7, c: 0}, {r: 6, c: 0}
            ];
        }

        function moveToken(color, index) {
            if (!canMove) return;
            let playerColor = currentTurn === 0 ? 'red' : 'blue';
            if (color !== playerColor) return;

            let pos = tokens[color][index];

            if (pos === -1) {
                if (diceVal === 6) {
                    tokens[color][index] = 0; // O'yinga chiqish
                } else {
                    statusText.innerText = "6 tushishi kerak!";
                    return;
                }
            } else {
                tokens[color][index] += diceVal;
                if (tokens[color][index] >= 52) {
                    statusText.innerText = `${color.toUpperCase()} yutdi! 🎉`;
                    canMove = false;
                    return;
                }
            }

            renderTokens();
            nextTurn();
        }

        function nextTurn() {
            canMove = false;
            currentTurn = currentTurn === 0 ? 1 : 0;
            updateTurnUI();
            statusText.innerText = "Zarni tashlang!";

            if (gameMode === 'single' && currentTurn === 1) {
                setTimeout(rollDice, 1000);
            }
        }

        function botMove() {
            // Bot uchun mantiq: uyda turganlardan chiqishga harakat qiladi yoki birinchi chipni yuradi
            let moveableIndices = [];
            tokens.blue.forEach((pos, idx) => {
                if (pos !== -1 || diceVal === 6) moveableIndices.push(idx);
            });

            if (moveableIndices.length > 0) {
                let chosenIdx = moveableIndices[Math.floor(Math.random() * moveableIndices.length)];
                moveToken('blue', chosenIdx);
            } else {
                nextTurn();
            }
        }

        // Boshlang'ich yuklash
        createBoard();
    </script>
</body>
</html>
