<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Color Block Generator</title>
    <style>
        :root {
            --bg-color: #f4f4f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        /* Color Block Grid */
        .color-block-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 160px);
            gap: 15px;
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
        }

        .block {
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            box-shadow: inset 0 0 0 rgba(0,0,0,0.1);
        }

        .block:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        /* Span variations for dynamic look */
        .block:nth-child(1) { grid-column: span 2; }
        .block:nth-child(4) { grid-column: span 2; }

        .hex-code {
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .block:hover .hex-code {
            opacity: 1;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            background-color: #111;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #333;
        }

        button:active {
            transform: scale(0.97);
        }

        .toast {
            position: fixed;
            bottom: 25px;
            background: #222;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .color-block-grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }
            .block {
                height: 120px;
            }
            .block:nth-child(1), .block:nth-child(4) {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Professional Color Block</h1>
        <p>Estetik va zamonaviy ranglar kombinatsiyasini yarating. Nusxalash uchun blok ustiga bosing.</p>
        
        <div class="color-block-grid" id="grid">
            <!-- JavaScript orqali bloklar qo'shiladi -->
        </div>

        <div class="controls">
            <button id="generateBtn">Yangi Palitra</button>
        </div>
    </div>

    <div class="toast" id="toast">HEX kod nusxalandi!</div>

    <script>
        const palettes = [
            ["#1E293B", "#334155", "#64748B", "#CBD5E1", "#F1F5F9"], // Slate Minimal
            ["#2C3E50", "#E74C3C", "#ECF0F1", "#BDC3C7", "#34495E"], // Modern Corporate
            ["#2D3748", "#4A5568", "#ED8936", "#F6AD55", "#F7FAFC"], // Warm Terracotta
            ["#0F172A", "#047857", "#10B981", "#6EE7B7", "#F0FDF4"], // Sage & Deep Navy
            ["#3B2F2F", "#8C6D62", "#D7CCC8", "#EFEBE9", "#A1887F"], // Soft Earthy Tones
            ["#222222", "#444444", "#E63946", "#F1FAEE", "#A8DADC"]  // Neo Classic
        ];

        const grid = document.getElementById('grid');
        const generateBtn = document.getElementById('generateBtn');
        const toast = document.getElementById('toast');

        function getRandomPalette() {
            const randomIndex = Math.floor(Math.random() * palettes.length);
            return palettes[randomIndex];
        }

        function renderBlocks() {
            grid.innerHTML = '';
            const currentColors = getRandomPalette();
            
            // 4 ta blok hosil qilamiz
            for (let i = 0; i < 4; i++) {
                const color = currentColors[i % currentColors.length];
                const block = document.createElement('div');
                block.classList.add('block');
                block.style.backgroundColor = color;
                
                const hexSpan = document.createElement('span');
                hexSpan.classList.add('hex-code');
                hexSpan.textContent = color;
                
                block.appendChild(hexSpan);
                
                // Bosganda rang kodini xotiraga nusxalash
                block.addEventListener('click', () => {
                    navigator.clipboard.writeText(color);
                    showToast(color);
                });

                grid.appendChild(block);
            }
        }

        function showToast(color) {
            toast.textContent = `${color} nusxalandi!`;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1500);
        }

        generateBtn.addEventListener('click', renderBlocks);

        // Sahifa ochilganda avtish yaratish
        renderBlocks();
    </script>
</body>
</html>
