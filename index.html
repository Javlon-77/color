<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Puzzle Game - Combo & Sound</title>
    <style>
        :root {
            --bg-color: #2b2b40;
            --board-bg: #1e1e2f;
            --cell-bg: #2a2a40;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 340px;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .score-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 15px;
            border-radius: 20px;
        }

        .board {
            position: relative;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 4px;
            background-color: var(--board-bg);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 340px;
            height: 340px;
            margin-bottom: 20px;
        }

        .cell {
            background-color: var(--cell-bg);
            border-radius: 4px;
            transition: background 0.1s ease, transform 0.2s ease;
        }

        .cell.pop {
            animation: popEffect 0.3s ease;
        }

        @keyframes popEffect {
            0% { transform: scale(1); background-color: #fff; }
            50% { transform: scale(1.2); background-color: #ff4757; }
            100% { transform: scale(1); background-color: var(--cell-bg); }
        }

        /* Combo yozuvi uchun animatsiya */
        .combo-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            color: #f1c40f;
            font-size: 2.2rem;
            font-weight: 900;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 5;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            opacity: 0;
        }

        .combo-popup.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .dock {
            display: flex;
            justify-content: center;
            gap: 15px;
            height: 100px;
            width: 340px;
            align-items: center;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            padding: 10px;
        }

        .piece-container {
            cursor: grab;
            display: grid;
            gap: 2px;
            padding: 5px;
            border: 2px solid transparent;
            border-radius: 8px;
            transition: transform 0.1s;
        }

        .piece-container.selected {
            border-color: #fff;
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.05);
        }

        .p-block {
            width: 22px;
            height: 22px;
            border-radius: 3px;
        }

        .color-yellow { background-color: #f1c40f; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }
        .preview-yellow { background-color: rgba(241, 196, 15, 0.4) !important; }

        .color-orange { background-color: #e67e22; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }
        .preview-orange { background-color: rgba(230, 126, 34, 0.4) !important; }

        .color-purple { background-color: #9b59b6; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }
        .preview-purple { background-color: rgba(155, 89, 182, 0.4) !important; }

        .color-green  { background-color: #2ecc71; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }
        .preview-green  { background-color: rgba(46, 204, 113, 0.4) !important; }

        .color-red    { background-color: #e74c3c; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }
        .preview-red    { background-color: rgba(231, 76, 60, 0.4) !important; }

        .color-cyan   { background-color: #1abc9c; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }
        .preview-cyan   { background-color: rgba(26, 188, 156, 0.4) !important; }

        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
            z-index: 10;
        }

        .game-over h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #e74c3c;
        }

        .game-over button {
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-box">
            🏆 <span id="score">0</span>
        </div>
    </div>

    <div class="board" id="board">
        <div class="combo-popup" id="comboPopup">COMBO!</div>
    </div>

    <div class="dock" id="dock"></div>

    <div class="game-over" id="gameOverScreen">
        <h2>O'yin Tugadi!</h2>
        <p style="margin-bottom: 20px;">Natija: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">Qaytadan boshlash</button>
    </div>

    <script>
        const BOARD_SIZE = 8;
        let boardData = Array(BOARD_SIZE).fill(0).map(() => Array(BOARD_SIZE).fill(null));
        let score = 0;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'place') {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'combo') {
                // Combo uchun baland, quvonchli va tantanali tovush
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            }
        }

        const shapes = [
            { shape: [[1,1],[1,1]], color: 'color-yellow', preview: 'preview-yellow' },
            { shape: [[1,1,1]], color: 'color-orange', preview: 'preview-orange' },
            { shape: [[1],[1],[1]], color: 'color-purple', preview: 'preview-purple' },
            { shape: [[1]], color: 'color-green', preview: 'preview-green' },
            { shape: [[1,1,1,1]], color: 'color-red', preview: 'preview-red' },
            { shape: [[1,1],[1,0]], color: 'color-cyan', preview: 'preview-cyan' }
        ];

        let currentPieces = [null, null, null];
        let selectedPieceIndex = null;

        const boardEl = document.getElementById('board');
        const dockEl = document.getElementById('dock');
        const scoreEl = document.getElementById('score');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreEl = document.getElementById('finalScore');
        const comboPopup = document.getElementById('comboPopup');

        function initBoard() {
            // Faqat katakchalarni qayta chizamiz, combo pop-upga teginmaymiz
            const existingCells = boardEl.querySelectorAll('.cell');
            existingCells.forEach(c => c.remove());

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    if (boardData[r][c]) {
                        cell.classList.add(boardData[r][c]);
                    }

                    cell.addEventListener('mouseenter', () => handleCellOver(r, c));
                    cell.addEventListener('click', () => handleCellClick(r, c));
                    
                    boardEl.appendChild(cell);
                }
            }
            boardEl.addEventListener('mouseleave', clearPreview);
        }

        function generatePieces() {
            currentPieces = [];
            for (let i = 0; i < 3; i++) {
                let randomShape = shapes[Math.floor(Math.random() * shapes.length)];
                currentPieces.push(JSON.parse(JSON.stringify(randomShape)));
            }
            renderDock();
            checkGameOver();
        }

        function renderDock() {
            dockEl.innerHTML = '';
            currentPieces.forEach((piece, index) => {
                if (!piece) return;
                const container = document.createElement('div');
                container.classList.add('piece-container');
                if (selectedPieceIndex === index) {
                    container.classList.add('selected');
                }
                container.style.gridTemplateColumns = `repeat(${piece.shape[0].length}, 22px)`;
                
                piece.shape.forEach(row => {
                    row.forEach(val => {
                        const block = document.createElement('div');
                        if (val === 1) {
                            block.classList.add('p-block', piece.color);
                        } else {
                            block.style.width = '22px';
                            block.style.height = '22px';
                        }
                        container.appendChild(block);
                    });
                });

                container.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectPiece(index);
                });

                dockEl.appendChild(container);
            });
        }

        function selectPiece(index) {
            selectedPieceIndex = index;
            renderDock();
        }

        function canPlace(piece, startR, startC) {
            const shape = piece.shape;
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c] === 1) {
                        let targetR = startR + r;
                        let targetC = startC + c;
                        if (targetR >= BOARD_SIZE || targetC >= BOARD_SIZE || boardData[targetR][targetC] !== null) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function handleCellOver(startR, startC) {
            clearPreview();
            if (selectedPieceIndex === null) return;
            const piece = currentPieces[selectedPieceIndex];
            if (!piece) return;

            if (canPlace(piece, startR, startC)) {
                const shape = piece.shape;
                for (let r = 0; r < shape.length; r++) {
                    for (let c = 0; c < shape[r].length; c++) {
                        if (shape[r][c] === 1) {
                            let targetR = startR + r;
                            let targetC = startC + c;
                            // Cell elementlarini topish (+1 chunki 0-indeksda comboPopup yotibdi)
                            let cellIndex = targetR * BOARD_SIZE + targetC;
                            let cellEls = boardEl.getElementsByClassName('cell');
                            if (cellEls[cellIndex]) {
                                cellEls[cellIndex].classList.add(piece.preview);
                            }
                        }
                    }
                }
            }
        }

        function clearPreview() {
            let cellEls = boardEl.getElementsByClassName('cell');
            Array.from(cellEls).forEach(cell => {
                shapes.forEach(s => cell.classList.remove(s.preview));
            });
        }

        function handleCellClick(startR, startC) {
            if (selectedPieceIndex === null) return;
            const piece = currentPieces[selectedPieceIndex];

            if (canPlace(piece, startR, startC)) {
                placePiece(piece, startR, startC);
                playSound('place');
                
                currentPieces[selectedPieceIndex] = null;
                selectedPieceIndex = null;
                
                clearLines();
                initBoard();
                renderDock();

                if (currentPieces.every(p => p === null)) {
                    generatePieces();
                } else {
                    checkGameOver();
                }
            }
        }

        function placePiece(piece, startR, startC) {
            const shape = piece.shape;
            let placedBlocksCount = 0;
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c] === 1) {
                        boardData[startR + r][startC + c] = piece.color;
                        placedBlocksCount++;
                    }
                }
            }
            // Har bir qo'yilgan katak uchun bazaviy ball
            score += placedBlocksCount * 10;
            scoreEl.textContent = score;
        }

        function clearLines() {
            let rowsToClear = [];
            let colsToClear = [];

            for (let r = 0; r < BOARD_SIZE; r++) {
                if (boardData[r].every(cell => cell !== null)) rowsToClear.push(r);
            }

            for (let c = 0; c < BOARD_SIZE; c++) {
                let fullCol = true;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (boardData[r][c] === null) { fullCol = false; break; }
                }
                if (fullCol) colsToClear.push(c);
            }

            let totalClearedLines = rowsToClear.length + colsToClear.length;

            if (totalClearedLines > 0) {
                playSound('combo');

                // Qancha ko'p qator bir vaqtda tozalandi, shuncha ko'p multiplikator (multiplier) ishlaydi
                // Masalan: 1 ta qator = 100 * 1 = 100; 2 ta qator = 200 * 2 = 400 ball, kabi.
                let bonusScore = totalClearedLines * 100 * totalClearedLines;
                score += bonusScore;
                scoreEl.textContent = score;

                // Agar 1 tadan ko'p qator tozalanib combo bo'lsa, yozuvni chiqaramiz
                if (totalClearedLines >= 1) {
                    comboPopup.textContent = totalClearedLines > 1 ? `${totalClearedLines}x COMBO!` : "COMBO!";
                    comboPopup.classList.add('show');
                    setTimeout(() => {
                        comboPopup.classList.remove('show');
                    }, 800);
                }
            }

            let cellEls = boardEl.getElementsByClassName('cell');

            rowsToClear.forEach(r => {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    let cellEl = cellEls[r * BOARD_SIZE + c];
                    if (cellEl) cellEl.classList.add('pop');
                    boardData[r][c] = null;
                }
            });

            colsToClear.forEach(c => {
                for (let r = 0; r < BOARD_SIZE; r++) {
                    let cellEl = cellEls[r * BOARD_SIZE + c];
                    if (cellEl) cellEl.classList.add('pop');
                    boardData[r][c] = null;
                }
            });
        }

        function checkGameOver() {
            let availablePieces = currentPieces.filter(p => p !== null);
            if (availablePieces.length === 0) return;

            let canMove = false;
            for (let piece of availablePieces) {
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (canPlace(piece, r, c)) { canMove = true; break; }
                    }
                    if (canMove) break;
                }
                if (canMove) break;
            }

            if (!canMove) {
                finalScoreEl.textContent = score;
                gameOverScreen.style.display = 'flex';
            }
        }

        function restartGame() {
            boardData = Array(BOARD_SIZE).fill(0).map(() => Array(BOARD_SIZE).fill(null));
            score = 0;
            scoreEl.textContent = score;
            gameOverScreen.style.display = 'none';
            selectedPieceIndex = null;
            initBoard();
            generatePieces();
        }

        initBoard();
        generatePieces();
    </script>
</body>
</html>
