<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo - Zamonaviy O'yin</title>
    <style>
        :root {
            --red: #e74c3c;
            --green: #2ecc71;
            --yellow: #f1c40f;
            --blue: #3498db;
            --bg: #1a1a2e;
            --panel: #16213e;
            --text: #eaeaea;
            --accent: #0f3460;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
            letter-spacing: 2px;
        }

        /* Menu ekrani */
        #menuScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 50px;
        }

        .menu-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            min-width: 280px;
        }

        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
        }

        .menu-btn.ai { background: linear-gradient(45deg, #e74c3c, #c0392b); }
        .menu-btn.ai:hover { box-shadow: 0 8px 20px rgba(231, 76, 60, 0.4); }

        .menu-btn.two { background: linear-gradient(45deg, #2ecc71, #27ae60); }
        .menu-btn.two:hover { box-shadow: 0 8px 20px rgba(46, 204, 113, 0.4); }

        .menu-btn.three { background: linear-gradient(45deg, #f1c40f, #f39c12); color: #222; }
        .menu-btn.three:hover { box-shadow: 0 8px 20px rgba(241, 196, 15, 0.4); }

        .menu-btn.four { background: linear-gradient(45deg, #9b59b6, #8e44ad); }
        .menu-btn.four:hover { box-shadow: 0 8px 20px rgba(155, 89, 182, 0.4); }

        /* O'yin ekrani */
        #gameScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 700px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .back-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .back-btn:hover { background: #0d2b4d; }

        .turn-indicator {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            background: var(--panel);
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }

        .turn-indicator.red { border-color: var(--red); color: var(--red); }
        .turn-indicator.green { border-color: var(--green); color: var(--green); }
        .turn-indicator.yellow { border-color: var(--yellow); color: var(--yellow); }
        .turn-indicator.blue { border-color: var(--blue); color: var(--blue); }

        /* Ludo doskasi */
        .board-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1;
            background: var(--panel);
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            width: 100%;
            height: 100%;
            gap: 1px;
            background: #0a0a1a;
            border-radius: 8px;
            overflow: hidden;
        }

        .cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            border-radius: 2px;
            transition: background 0.2s;
        }

        /* Asosiy yo'l */
        .track { background: #2c2c3a; }
        .track-safe {
            background: #3a3a4a;
            position: relative;
        }
        .track-safe::after {
            content: '\2605';
            color: #ffd700;
            font-size: 0.7rem;
        }

        /* Uylar va startlar */
        .home-red { background: rgba(231, 76, 60, 0.15); }
        .home-green { background: rgba(46, 204, 113, 0.15); }
        .home-yellow { background: rgba(241, 196, 15, 0.15); }
        .home-blue { background: rgba(52, 152, 219, 0.15); }

        .start-red { background: var(--red) !important; box-shadow: inset 0 0 8px rgba(0,0,0,0.3); }
        .start-green { background: var(--green) !important; box-shadow: inset 0 0 8px rgba(0,0,0,0.3); }
        .start-yellow { background: var(--yellow) !important; box-shadow: inset 0 0 8px rgba(0,0,0,0.3); }
        .start-blue { background: var(--blue) !important; box-shadow: inset 0 0 8px rgba(0,0,0,0.3); }

        /* G'alaba yo'lakchalari */
        .path-red { background: rgba(231, 76, 60, 0.4); }
        .path-green { background: rgba(46, 204, 113, 0.4); }
        .path-yellow { background: rgba(241, 196, 15, 0.4); }
        .path-blue { background: rgba(52, 152, 219, 0.4); }

        .center {
            background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #1dd1a1);
            grid-column: 7 / 10;
            grid-row: 7 / 10;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #222;
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
        }

        /* Bazalar (katta uy) */
        .base-red {
            background: rgba(231, 76, 60, 0.2);
            border: 2px solid var(--red);
            border-radius: 8px;
        }
        .base-green {
            background: rgba(46, 204, 113, 0.2);
            border: 2px solid var(--green);
            border-radius: 8px;
        }
        .base-yellow {
            background: rgba(241, 196, 15, 0.2);
            border: 2px solid var(--yellow);
            border-radius: 8px;
        }
        .base-blue {
            background: rgba(52, 152, 219, 0.2);
            border: 2px solid var(--blue);
            border-radius: 8px;
        }

        /* Donalar (fishkalar) */
        .piece {
            width: 70%;
            height: 70%;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .piece:hover { transform: scale(1.15); }
        .piece.selected {
            animation: pulse 0.8s infinite;
            box-shadow: 0 0 12px rgba(255,255,255,0.6);
        }
        .piece.red { background: radial-gradient(circle at 30% 30%, #ff7b7b, var(--red)); }
        .piece.green { background: radial-gradient(circle at 30% 30%, #5eff9a, var(--green)); }
        .piece.yellow { background: radial-gradient(circle at 30% 30%, #ffeb3b, #d4a000); }
        .piece.blue { background: radial-gradient(circle at 30% 30%, #74b9ff, var(--blue)); }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        /* Zar (dice) */
        .dice-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }

        .dice {
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .dice.rolling { animation: shake 0.4s ease-in-out; }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
        }

        .dot {
            width: 12px;
            height: 12px;
            background: #222;
            border-radius: 50%;
            align-self: center;
            justify-self: center;
        }

        .roll-btn {
            padding: 12px 35px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
            font-weight: bold;
            transition: all 0.2s;
        }
        .roll-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(231,76,60,0.4); }
        .roll-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .dice-info {
            font-size: 0.9rem;
            color: #aaa;
            min-height: 20px;
        }

        /* O'yinchi ma'lumotlari */
        .players-info {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .player-card {
            padding: 8px 16px;
            border-radius: 10px;
            background: var(--panel);
            border: 2px solid transparent;
            font-size: 0.85rem;
            text-align: center;
            min-width: 100px;
        }
        .player-card.active { border-color: white; box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .player-card.red { border-left: 4px solid var(--red); }
        .player-card.green { border-left: 4px solid var(--green); }
        .player-card.yellow { border-left: 4px solid var(--yellow); }
        .player-card.blue { border-left: 4px solid var(--blue); }
        .player-card.ai::after { content: ' (AI)'; font-size: 0.7rem; opacity: 0.7; }

        /* G'alaba oynasi */
        #winModal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }

        #winModal.show { display: flex; }

        .win-box {
            background: var(--panel);
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255,255,255,0.1);
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .win-box h2 { font-size: 2.5rem; margin-bottom: 10px; }
        .win-box p { font-size: 1.2rem; color: #aaa; margin-bottom: 20px; }

        .win-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #2ecc71, #27ae60);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* Bazadagi donalar */
        .base-piece {
            width: 40%;
            height: 40%;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        .base-piece.red { background: radial-gradient(circle at 30% 30%, #ff7b7b, var(--red)); }
        .base-piece.green { background: radial-gradient(circle at 30% 30%, #5eff9a, var(--green)); }
        .base-piece.yellow { background: radial-gradient(circle at 30% 30%, #ffeb3b, #d4a000); }
        .base-piece.blue { background: radial-gradient(circle at 30% 30%, #74b9ff, var(--blue)); }
    </style>
</head>
<body>
    <h1>🎲 LUDO</h1>

    <!-- MENU -->
    <div id="menuScreen">
        <p style="color:#aaa; margin-bottom:10px;">O'yin rejimini tanlang:</p>
        <button class="menu-btn ai" onclick="startGame(1, true)">🤖 Kompyuterga qarshi (1 o'yinchi)</button>
        <button class="menu-btn two" onclick="startGame(2, false)">👥 2 kishilik (Navbatma-navbat)</button>
        <button class="menu-btn three" onclick="startGame(3, false)">👥 3 kishilik (Navbatma-navbat)</button>
        <button class="menu-btn four" onclick="startGame(4, false)">👥 4 kishilik (Navbatma-navbat)</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen">
        <div class="game-header">
            <button class="back-btn" onclick="backToMenu()">← Menyu</button>
            <div id="turnIndicator" class="turn-indicator">Navbat: Qizil</div>
            <div style="width:80px;"></div>
        </div>

        <div class="board-container">
            <div class="board" id="board"></div>
        </div>

        <div class="dice-area">
            <div class="dice" id="dice">
                <div class="dot" style="grid-area:2/2;"></div>
            </div>
            <button class="roll-btn" id="rollBtn" onclick="rollDice()">Zar tashlash</button>
            <div class="dice-info" id="diceInfo"></div>
        </div>

        <div class="players-info" id="playersInfo"></div>
    </div>

    <!-- WIN MODAL -->
    <div id="winModal">
        <div class="win-box">
            <h2 id="winTitle">🎉 G'olib!</h2>
            <p id="winText">Qizil o'yinchi yutdi!</p>
            <button class="win-btn" onclick="backToMenu()">Bosh menyu</button>
        </div>
    </div>

    <script>
        // ============================================
        // LUDO O'YINI - TO'LIQ KOD
        // ============================================

        const COLORS = ['red', 'green', 'yellow', 'blue'];
        const COLOR_NAMES = { red: 'Qizil', green: 'Yashil', yellow: 'Sariq', blue: 'Ko\'k' };
        const COLOR_VARS = { red: '#e74c3c', green: '#2ecc71', yellow: '#f1c40f', blue: '#3498db' };

        // Doska koordinatalari (15x15 grid)
        // Har bir rang uchun: start pozitsiyasi, yo'l, g'alaba yo'li
        const START_POSITIONS = {
            red: { r: 6, c: 1 },      // Qizil start
            green: { r: 1, c: 8 },    // Yashil start
            yellow: { r: 8, c: 13 },  // Sariq start
            blue: { r: 13, c: 6 }     // Ko'k start
        };

        // Asosiy yo'l (soat yo'nalishi bo'yicha, har bir rang uchun 0=uzining starti)
        // Track indices: 0-51 (52 ta katakcha)
        const TRACK_PATH = [];
        // Yo'lni quramiz
        function buildTrack() {
            // Yuqori qism (chapdan o'ngga)
            for (let c = 0; c < 6; c++) TRACK_PATH.push({ r: 6, c: c });
            // O'ng yuqori burchak
            TRACK_PATH.push({ r: 6, c: 6 });
            // O'ng qism (yuqoridan pastga)
            for (let r = 0; r < 6; r++) TRACK_PATH.push({ r: r, c: 8 });
            // Pastki o'ng burchak
            TRACK_PATH.push({ r: 6, c: 8 });
            // Pastki qism (o'ngdan chapga)
            for (let c = 9; c < 15; c++) TRACK_PATH.push({ r: 8, c: c });
            // Chap pastki burchak
            TRACK_PATH.push({ r: 8, c: 8 });
            // Chap qism (pastdan yuqoriga)
            for (let r = 9; r < 15; r++) TRACK_PATH.push({ r: r, c: 6 });
            // Chap yuqori burchak
            TRACK_PATH.push({ r: 8, c: 6 });
            // Yuqori qism (chapdan o'ngga davom)
            for (let c = 5; c >= 0; c--) TRACK_PATH.push({ r: 8, c: c });
            // Bitta qolgan joy
            TRACK_PATH.push({ r: 8, c: 0 }); // Bu yer noto'g'ri, to'g'rilaymiz
        }
        // To'g'ri yo'lni qo'lda belgilaymiz
        const MAIN_TRACK = [
            // Qizil start atrofidan boshlab soat yo'nalishi
            {r:6,c:1},{r:6,c:2},{r:6,c:3},{r:6,c:4},{r:6,c:5},
            {r:6,c:6}, // markazdan yuqori
            {r:5,c:6},{r:4,c:6},{r:3,c:6},{r:2,c:6},{r:1,c:6},
            {r:0,c:6},
            {r:0,c:7},
            {r:0,c:8},{r:1,c:8},{r:2,c:8},{r:3,c:8},{r:4,c:8},{r:5,c:8},
            {r:6,c:8},
            {r:6,c:9},{r:6,c:10},{r:6,c:11},{r:6,c:12},{r:6,c:13},
            {r:6,c:14},
            {r:7,c:14},
            {r:8,c:14},{r:8,c:13},{r:8,c:12},{r:8,c:11},{r:8,c:10},{r:8,c:9},
            {r:8,c:8},
            {r:9,c:8},{r:10,c:8},{r:11,c:8},{r:12,c:8},{r:13,c:8},
            {r:14,c:8},
            {r:14,c:7},
            {r:14,c:6},{r:13,c:6},{r:12,c:6},{r:11,c:6},{r:10,c:6},{r:9,c:6},
            {r:8,c:6},
            {r:8,c:5},{r:8,c:4},{r:8,c:3},{r:8,c:2},{r:8,c:1},
            {r:8,c:0},
            {r:7,c:0},
            {r:6,c:0},
        ];

        // G'alaba yo'lakchalari (har bir rang uchun markazga 5 ta katakcha)
        const HOME_PATHS = {
            red:    [{r:7,c:1},{r:7,c:2},{r:7,c:3},{r:7,c:4},{r:7,c:5},{r:7,c:6}],
            green:  [{r:1,c:7},{r:2,c:7},{r:3,c:7},{r:4,c:7},{r:5,c:7},{r:6,c:7}],
            yellow: [{r:7,c:13},{r:7,c:12},{r:7,c:11},{r:7,c:10},{r:7,c:9},{r:7,c:8}],
            blue:   [{r:13,c:7},{r:12,c:7},{r:11,c:7},{r:10,c:7},{r:9,c:7},{r:8,c:7}]
        };

        // Xavfsiz katakchalar (ulduzchali)
        const SAFE_CELLS = [
            {r:6,c:1},{r:2,c:6},{r:6,c:12},{r:10,c:8},
            {r:8,c:13},{r:12,c:8},{r:8,c:2},{r:1,c:8},
            {r:6,c:6},{r:6,c:8},{r:8,c:8},{r:8,c:6}
        ];

        // Bazalar (har bir rangning 4 ta donasi)
        const BASE_POSITIONS = {
            red:    [{r:1,c:1},{r:1,c:4},{r:4,c:1},{r:4,c:4}],
            green:  [{r:1,c:10},{r:1,c:13},{r:4,c:10},{r:4,c:13}],
            yellow: [{r:10,c:10},{r:10,c:13},{r:13,c:10},{r:13,c:13}],
            blue:   [{r:10,c:1},{r:10,c:4},{r:13,c:1},{r:13,c:4}]
        };

        // O'yin holati
        let gameState = {
            players: [],
            currentPlayer: 0,
            diceValue: 0,
            diceRolled: false,
            pieces: {}, // color -> [{pos, inHome, inBase, homeIndex}]
            aiMode: false,
            gameOver: false,
            extraTurn: false
        };

        // ============================================
        // DOSKA YARATISH
        // ============================================
        function createBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';

            // 15x15 grid yaratamiz
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.r = r;
                    cell.dataset.c = c;

                    // Bazalar
                    if (r >= 0 && r <= 5 && c >= 0 && c <= 5) cell.classList.add('base-red');
                    else if (r >= 0 && r <= 5 && c >= 9 && c <= 14) cell.classList.add('base-green');
                    else if (r >= 9 && r <= 14 && c >= 9 && c <= 14) cell.classList.add('base-yellow');
                    else if (r >= 9 && r <= 14 && c >= 0 && c <= 5) cell.classList.add('base-blue');
                    // Markaz
                    else if (r >= 6 && r <= 8 && c >= 6 && c <= 8) {
                        if (r === 7 && c === 7) {
                            cell.classList.add('center');
                            cell.innerHTML = '🏆';
                        }
                        // G'alaba yo'lakchalari
                        else if (r === 7 && c >= 1 && c <= 6) cell.classList.add('path-red');
                        else if (c === 7 && r >= 1 && r <= 6) cell.classList.add('path-green');
                        else if (r === 7 && c >= 8 && c <= 13) cell.classList.add('path-yellow');
                        else if (c === 7 && r >= 8 && r <= 13) cell.classList.add('path-blue');
                    }
                    // Asosiy yo'l
                    else {
                        const isTrack = MAIN_TRACK.some(p => p.r === r && p.c === c);
                        if (isTrack) {
                            const isSafe = SAFE_CELLS.some(p => p.r === r && p.c === c);
                            cell.classList.add(isSafe ? 'track-safe' : 'track');
                        }
                        // Uylar (startlar)
                        if (r === 6 && c === 1) cell.classList.add('start-red');
                        if (r === 1 && c === 8) cell.classList.add('start-green');
                        if (r === 8 && c === 13) cell.classList.add('start-yellow');
                        if (r === 13 && c === 6) cell.classList.add('start-blue');
                    }

                    board.appendChild(cell);
                }
            }
        }

        // ============================================
        // O'YIN BOSHLASH
        // ============================================
        function startGame(numPlayers, aiMode) {
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';

            gameState = {
                players: [],
                currentPlayer: 0,
                diceValue: 0,
                diceRolled: false,
                pieces: {},
                aiMode: aiMode,
                gameOver: false,
                extraTurn: false
            };

            // O'yinchilarni sozlash
            for (let i = 0; i < numPlayers; i++) {
                gameState.players.push({
                    color: COLORS[i],
                    isAI: aiMode && i === 1 // 2-o'yinchi AI bo'ladi (1 vs AI rejimida)
                });
            }

            // Donalarni boshlash
            COLORS.forEach((color, idx) => {
                if (idx < numPlayers) {
                    gameState.pieces[color] = BASE_POSITIONS[color].map((pos, i) => ({
                        id: i,
                        pos: pos,
                        inBase: true,
                        inHome: false,
                        homeIndex: -1,
                        trackIndex: -1
                    }));
                }
            });

            createBoard();
            renderPieces();
            updateUI();
            updatePlayersInfo();
        }

        function backToMenu() {
            document.getElementById('menuScreen').style.display = 'flex';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('winModal').classList.remove('show');
        }

        // ============================================
        // DONALARNI CHIZISH
        // ============================================
        function renderPieces() {
            // Avval barcha donalarni tozalash
            document.querySelectorAll('.piece, .base-piece').forEach(el => el.remove());

            COLORS.forEach(color => {
                if (!gameState.pieces[color]) return;
                gameState.pieces[color].forEach(piece => {
                    const el = document.createElement('div');
                    if (piece.inBase) {
                        el.className = `base-piece ${color}`;
                    } else {
                        el.className = `piece ${color}`;
                        el.innerText = piece.id + 1;
                        el.onclick = () => onPieceClick(color, piece.id);
                    }

                    // To'g'ri katakchani topish
                    let targetCell;
                    if (piece.inBase) {
                        targetCell = document.querySelector(`.cell[data-r="${piece.pos.r}"][data-c="${piece.pos.c}"]`);
                    } else if (piece.inHome) {
                        const hp = HOME_PATHS[color][piece.homeIndex];
                        targetCell = document.querySelector(`.cell[data-r="${hp.r}"][data-c="${hp.c}"]`);
                    } else {
                        const tp = MAIN_TRACK[piece.trackIndex];
                        targetCell = document.querySelector(`.cell[data-r="${tp.r}"][data-c="${tp.c}"]`);
                    }

                    if (targetCell) {
                        // Bazadagi donalarni joylashtirish
                        if (piece.inBase) {
                            const bases = BASE_POSITIONS[color];
                            const idx = bases.findIndex(b => b.r === piece.pos.r && b.c === piece.pos.c);
                            const offsets = [
                                {x: 15, y: 15}, {x: 55, y: 15},
                                {x: 15, y: 55}, {x: 55, y: 55}
                            ];
                            el.style.left = offsets[idx].x + '%';
                            el.style.top = offsets[idx].y + '%';
                            el.style.transform = 'translate(-50%, -50%)';
                        }
                        targetCell.appendChild(el);
                    }
                });
            });
        }

        // ============================================
        // ZAR TASHLASH
        // ============================================
        function rollDice() {
            if (gameState.gameOver || gameState.diceRolled) return;

            const btn = document.getElementById('rollBtn');
            btn.disabled = true;

            const dice = document.getElementById('dice');
            dice.classList.add('rolling');

            // Animatsiya
            let rolls = 0;
            const interval = setInterval(() => {
                showDiceFace(Math.floor(Math.random() * 6) + 1);
                rolls++;
                if (rolls >= 10) {
                    clearInterval(interval);
                    dice.classList.remove('rolling');
                    const value = Math.floor(Math.random() * 6) + 1;
                    gameState.diceValue = value;
                    gameState.diceRolled = true;
                    showDiceFace(value);

                    const currentColor = gameState.players[gameState.currentPlayer].color;
                    document.getElementById('diceInfo').innerText = `${COLOR_NAMES[currentColor]}: ${value} chiqdi!`;

                    // 6 chiqsa qayta zar tashlash huquqi
                    gameState.extraTurn = (value === 6);

                    // Agar barcha donalar bazada bo'lsa va 6 chiqmagan bo'lsa
                    const allInBase = gameState.pieces[currentColor].every(p => p.inBase);
                    if (allInBase && value !== 6) {
                        document.getElementById('diceInfo').innerText += ' (Barcha donalar bazada, navbat o\'tadi)';
                        setTimeout(nextTurn, 1500);
                        return;
                    }

                    // AI yurishi
                    if (gameState.players[gameState.currentPlayer].isAI) {
                        setTimeout(aiMove, 1000);
                    } else {
                        highlightMovablePieces();
                    }
                }
            }, 50);
        }

        function showDiceFace(n) {
            const dice = document.getElementById('dice');
            const dots = [];
            const patterns = {
                1: [[2,2]],
                2: [[1,1],[3,3]],
                3: [[1,1],[2,2],[3,3]],
                4: [[1,1],[1,3],[3,1],[3,3]],
                5: [[1,1],[1,3],[2,2],[3,1],[3,3]],
                6: [[1,1],[1,3],[2,1],[2,3],[3,1],[3,3]]
            };
            dice.innerHTML = '';
            patterns[n].forEach(([r,c]) => {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.style.gridArea = `${r}/${c}`;
                dice.appendChild(dot);
            });
        }

        // ============================================
        // DONANI HARAKATLANTIRISH
        // ============================================
        function onPieceClick(color, pieceId) {
            if (gameState.gameOver) return;
            if (!gameState.diceRolled) return;
            if (gameState.players[gameState.currentPlayer].color !== color) return;

            const piece = gameState.pieces[color][pieceId];
            const dice = gameState.diceValue;

            // Bazadan chiqish (faqat 6 bilan)
            if (piece.inBase) {
                if (dice !== 6) return;
                // Startga chiqish
                piece.inBase = false;
                piece.trackIndex = getStartIndex(color);
                checkCapture(color, piece.trackIndex);
                finishMove();
                return;
            }

            // Uyga kirish yo'li
            if (!piece.inHome) {
                const newIndex = piece.trackIndex + dice;
                // Uyga yetib kelish
                if (newIndex >= MAIN_TRACK.length) {
                    // Uy yo'lakchasiga kirish
                    const homeEntryIndex = newIndex - MAIN_TRACK.length;
                    if (homeEntryIndex < HOME_PATHS[color].length) {
                        piece.inHome = true;
                        piece.homeIndex = homeEntryIndex;
                        piece.trackIndex = -1;
                        finishMove();
                    }
                    return;
                }

                // Oddiy harakat
                piece.trackIndex = newIndex;
                checkCapture(color, piece.trackIndex);
                finishMove();
                return;
            }

            // Uy ichida harakat
            const newHomeIndex = piece.homeIndex + dice;
            if (newHomeIndex < HOME_PATHS[color].length) {
                piece.homeIndex = newHomeIndex;
                finishMove();
            }
        }

        function getStartIndex(color) {
            const start = START_POSITIONS[color];
            return MAIN_TRACK.findIndex(p => p.r === start.r && p.c === start.c);
        }

        function checkCapture(moverColor, trackIndex) {
            const pos = MAIN_TRACK[trackIndex];
            // Xavfsiz katakchada bo'lsa urib bo'lmaydi
            const isSafe = SAFE_CELLS.some(s => s.r === pos.r && s.c === pos.c);
            if (isSafe) return;

            COLORS.forEach(color => {
                if (color === moverColor) return;
                if (!gameState.pieces[color]) return;

                gameState.pieces[color].forEach(piece => {
                    if (piece.inBase || piece.inHome) return;
                    const pPos = MAIN_TRACK[piece.trackIndex];
                    if (pPos.r === pos.r && pPos.c === pos.c) {
                        // Urib yuborish!
                        piece.inBase = true;
                        piece.trackIndex = -1;
                        piece.pos = BASE_POSITIONS[color][piece.id];
                    }
                });
            });
        }

        function finishMove() {
            renderPieces();
            checkWin();
            if (!gameState.gameOver) {
                nextTurn();
            }
        }

        function nextTurn() {
            gameState.diceRolled = false;
            gameState.diceValue = 0;
            showDiceFace(1);

            if (!gameState.extraTurn) {
                gameState.currentPlayer = (gameState.currentPlayer + 1) % gameState.players.length;
            }
            gameState.extraTurn = false;

            updateUI();
            updatePlayersInfo();
            document.getElementById('rollBtn').disabled = false;
            document.getElementById('diceInfo').innerText = '';

            // AI navbati
            if (gameState.players[gameState.currentPlayer].isAI && !gameState.gameOver) {
                setTimeout(rollDice, 800);
            }
        }

        // ============================================
        // AI (SUN'IY INTELLEKT)
        // ============================================
        function aiMove() {
            const color = gameState.players[gameState.currentPlayer].color;
            const pieces = gameState.pieces[color];
            const dice = gameState.diceValue;

            // Mumkin bo'lgan yurishlarni topish
            let movable = [];

            pieces.forEach((piece, idx) => {
                if (piece.inBase && dice === 6) movable.push(idx);
                else if (!piece.inBase && !piece.inHome) {
                    const newIdx = piece.trackIndex + dice;
                    if (newIdx < MAIN_TRACK.length + HOME_PATHS[color].length) movable.push(idx);
                }
                else if (piece.inHome) {
                    const newIdx = piece.homeIndex + dice;
                    if (newIdx < HOME_PATHS[color].length) movable.push(idx);
                }
            });

            if (movable.length === 0) {
                nextTurn();
                return;
            }

            // Eng yaxshi yurishni tanlash (oddiy strategiya)
            let bestIdx = movable[0];
            let bestScore = -9999;

            movable.forEach(idx => {
                const piece = pieces[idx];
                let score = 0;

                if (piece.inBase && dice === 6) {
                    score = 50; // Bazadan chiqish yaxshi
                } else if (!piece.inHome) {
                    const newIdx = piece.trackIndex + dice;
                    if (newIdx >= MAIN_TRACK.length) {
                        score = 100; // Uyga kirish eng yaxshi
                    } else {
                        const pos = MAIN_TRACK[newIdx];
                        // Raqibni urish imkoniyati
                        const canCapture = COLORS.some(c => {
                            if (c === color || !gameState.pieces[c]) return false;
                            return gameState.pieces[c].some(p => {
                                if (p.inBase || p.inHome) return false;
                                const pp = MAIN_TRACK[p.trackIndex];
                                return pp.r === pos.r && pp.c === pos.c;
                            });
                        });
                        if (canCapture) score += 80;

                        // Xavfsiz katakchaga yetishish
                        const isSafe = SAFE_CELLS.some(s => s.r === pos.r && s.c === pos.c);
                        if (isSafe) score += 30;

                        // Oldinga harakat qilish
                        score += newIdx * 0.5;
                    }
                } else {
                    score = 60 + piece.homeIndex * 5;
                }

                if (score > bestScore) {
                    bestScore = score;
                    bestIdx = idx;
                }
            });

            onPieceClick(color, bestIdx);
        }

        // ============================================
        // G'ALABA TEKSHIRUVI
        // ============================================
        function checkWin() {
            const color = gameState.players[gameState.currentPlayer].color;
            const pieces = gameState.pieces[color];
            const allHome = pieces.every(p => p.inHome && p.homeIndex === HOME_PATHS[color].length - 1);

            if (allHome) {
                gameState.gameOver = true;
                document.getElementById('winTitle').innerText = '🎉 G\'olib!';
                document.getElementById('winText').innerText = `${COLOR_NAMES[color]} o'yinchi yutdi!`;
                document.getElementById('winModal').classList.add('show');
            }
        }

        // ============================================
        // INTERFEYS YANGILASH
        // ============================================
        function updateUI() {
            const color = gameState.players[gameState.currentPlayer].color;
            const indicator = document.getElementById('turnIndicator');
            indicator.className = `turn-indicator ${color}`;
            indicator.innerText = `Navbat: ${COLOR_NAMES[color]}`;
        }

        function updatePlayersInfo() {
            const container = document.getElementById('playersInfo');
            container.innerHTML = '';
            gameState.players.forEach((player, idx) => {
                const card = document.createElement('div');
                card.className = `player-card ${player.color} ${idx === gameState.currentPlayer ? 'active' : ''}`;
                if (player.isAI) card.classList.add('ai');

                // Uyga yetgan donalar soni
                const pieces = gameState.pieces[player.color] || [];
                const homeCount = pieces.filter(p => p.inHome).length;

                card.innerHTML = `<strong>${COLOR_NAMES[player.color]}</strong><br>${homeCount}/4 uyda`;
                container.appendChild(card);
            });
        }

        function highlightMovablePieces() {
            // Harakatlantirilishi mumkin bo'lgan donalarni belgilash
            const color = gameState.players[gameState.currentPlayer].color;
            const pieces = gameState.pieces[color];
            const dice = gameState.diceValue;

            document.querySelectorAll('.piece.selected').forEach(el => el.classList.remove('selected'));

            pieces.forEach((piece, idx) => {
                let canMove = false;
                if (piece.inBase && dice === 6) canMove = true;
                else if (!piece.inBase && !piece.inHome) {
                    const newIdx = piece.trackIndex + dice;
                    if (newIdx < MAIN_TRACK.length + HOME_PATHS[color].length) canMove = true;
                }
                else if (piece.inHome) {
                    const newIdx = piece.homeIndex + dice;
                    if (newIdx < HOME_PATHS[color].length) canMove = true;
                }

                if (canMove) {
                    const els = document.querySelectorAll(`.piece.${color}`);
                    if (els[idx]) els[idx].classList.add('selected');
                }
            });
        }

        // ============================================
        // BOSHLANG'ICH SOZLAMA
        // ============================================
        createBoard();
    </script>
</body>
</html>
